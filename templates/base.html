<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Speech Psychology · EEG{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
</head>
<body>
<div class="app-shell">
    <header class="app-topbar">
        <div class="app-topbar__brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Speech Psychology">
            <span class="app-topbar__brand-text">Speech Psychology</span>
        </div>
        <div class="app-topbar__user">
            <span class="badge-rol">{{ session.get('rol', '') }}</span>
            <span>{{ session.get('nombre', '') }}</span>
            <a href="{{ url_for('auth_bp.logout') }}" style="color: rgba(255,255,255,0.85);">Salir</a>
        </div>
    </header>

    <main class="app-main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
